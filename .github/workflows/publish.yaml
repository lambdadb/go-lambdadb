# Go modules are published through immutable Git tags. This workflow validates
# release metadata, runs the SDK checks, and creates the matching GitHub Release.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      make_latest: ${{ steps.release_metadata.outputs.make_latest }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release metadata
        id: release_metadata
        run: ./scripts/validate-release-metadata.sh "${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -count=1 -v ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: ${{ needs.test.outputs.make_latest }}
          prerelease: ${{ needs.test.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
