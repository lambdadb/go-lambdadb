# Go modules are published through immutable Git tags. A push to main verifies
# the committed release metadata and SDK checks without publishing. A v* tag push
# runs the same checks, confirms that the tagged commit is on main, and creates the
# matching GitHub Release.
#
# Every run ends with the deployed live smoke tests. A main push whose Version is
# already tagged targets the dev environment. A release commit on main (its Version
# is not tagged yet) and a v* tag push target production, so the GitHub Release is
# created only after the production smoke passes.

name: Publish

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      make_latest: ${{ steps.release_metadata.outputs.make_latest }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag push validates its own tag. A main push validates the committed
      # SDK Version as the tag it would be released under.
      - name: Validate release metadata
        id: release_metadata
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' lambdadb.go)"
          fi
          ./scripts/validate-release-metadata.sh "${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Verify the commit is on main
        run: ./scripts/verify-main-ancestry.sh HEAD

      - name: Select the live smoke environment
        id: smoke
        run: ./scripts/select-smoke-environment.sh >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -count=1 -v ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      # A missing Variable resolves to an empty value and fails the run; it never
      # falls back to the other environment.
      - name: Authenticate smoke tests to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars[format('{0}SMOKE_AWS_ROLE_ARN', steps.smoke.outputs.smoke_prefix)] }}
          aws-region: ap-northeast-2
          role-session-name: go-sdk-smoke-${{ github.run_id }}

      - name: Run deployed live smoke tests
        env:
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', steps.smoke.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', steps.smoke.outputs.smoke_prefix)] }}
          LAMBDADB_SMOKE_SECRET_ARN: ${{ vars[format('{0}SMOKE_SECRET_ARN', steps.smoke.outputs.smoke_prefix)] }}
        run: |
          echo "Live smoke target: ${LAMBDADB_BASE_URL}"
          ./scripts/run-live-smoke.sh

  release:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: ${{ needs.test.outputs.make_latest }}
          prerelease: ${{ needs.test.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
